<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>BATU · Display Screen</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='30%25' cy='25%25'%3E%3Cstop offset='0%25' stop-color='%231a2136'/%3E%3Cstop offset='100%25' stop-color='%230a0e18'/%3E%3C/radialGradient%3E%3ClinearGradient id='ring' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FFD54F'/%3E%3Cstop offset='50%25' stop-color='%23FFB300'/%3E%3Cstop offset='100%25' stop-color='%23FF8F00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='47' fill='url(%23bg)' stroke='url(%23ring)' stroke-width='4'/%3E%3Ctext x='50' y='59' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='24' fill='%23FFB300' letter-spacing='0.5'%3EBATU%3C/text%3E%3C/svg%3E">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }

        :root{
            --pad:   clamp(10px, 2.2vmin, 22px);
            --gap:   clamp(8px, 1.6vmin, 16px);
            --qr:    min(680px, 92vw, 62vh);
            --qr-p:  min(500px, 84vw, 46vh);
            --logo:  clamp(64px, 11vmin, 120px);
            --hero:  clamp(44px, 8vmin, 70px);
            --code:  clamp(34px, 6.5vmin, 68px);
            --safe-top:    env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            background: radial-gradient(circle at center, #0d1220 0%, #05070f 100%);
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body { overflow-x: hidden; }

        .nx-aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .nx-aurora .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; will-change: transform; }
        .nx-aurora .b1 { width: 480px; height: 480px; background: radial-gradient(circle, #FFB300, transparent 70%); top: -180px; right: -120px; animation: nxFloat1 24s ease-in-out infinite; }
        .nx-aurora .b2 { width: 420px; height: 420px; background: radial-gradient(circle, #7C3AED, transparent 70%); bottom: -160px; left: -120px; animation: nxFloat2 28s ease-in-out infinite; }
        .nx-aurora .b3 { width: 340px; height: 340px; background: radial-gradient(circle, #06B6D4, transparent 70%); top: 45%; left: 45%; animation: nxFloat3 32s ease-in-out infinite; opacity: 0.22; }
        @keyframes nxFloat1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px, 60px) scale(1.12); } }
        @keyframes nxFloat2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px, -50px) scale(1.1); } }
        @keyframes nxFloat3 { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-55%,-45%) scale(1.15); } }

        .nx-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .nx-particle {
            position: absolute; width: 3px; height: 3px; background: #FFB300; border-radius: 50%;
            box-shadow: 0 0 10px #FFB300, 0 0 20px rgba(255,179,0,0.5);
            opacity: 0; animation: nxRise linear infinite;
        }
        @keyframes nxRise {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        @keyframes nxSpin { to { transform: rotate(360deg); } }

        #fs-btn {
            position: fixed;
            top: calc(12px + var(--safe-top));
            left: 12px;
            z-index: 200;
            width: 42px; height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(255,179,0,0.45);
            background: rgba(0,0,0,0.5);
            color: #FFB300;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all .25s ease;
        }
        #fs-btn:hover { background: rgba(255,179,0,0.18); transform: translateY(-1px); }
        #fs-btn.show { display: inline-flex; }

        #pair-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: calc(var(--pad) + var(--safe-top)) var(--pad) calc(var(--pad) + var(--safe-bottom));
            gap: var(--gap);
            text-align: center;
            overflow-y: auto;
        }

        .nx-logo-wrap {
            position: relative;
            width: var(--logo);
            height: var(--logo);
            margin: 0 auto clamp(8px, 1.6vmin, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .nx-logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, #FFB300 120deg, #7C3AED 240deg, transparent 360deg);
            animation: nxSpin 6s linear infinite;
            filter: blur(0.5px);
        }
        .nx-logo-ring::after {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: #0b0f1a;
        }
        .nx-logo-core {
            position: relative;
            z-index: 2;
            width: calc(var(--logo) - 20px);
            height: calc(var(--logo) - 20px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 30% 25%, #1a2136, #0a0e18);
            border: 1px solid rgba(255,179,0,0.35);
            box-shadow: 0 0 60px rgba(255,179,0,0.35), inset 0 0 30px rgba(255,179,0,0.18);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: calc(var(--logo) * 0.19);
            font-weight: 900;
            color: #FFB300;
            letter-spacing: 2px;
        }

        .nx-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: clamp(6px, 1.4vmin, 16px);
            width: 100%;
            max-width: 700px;
            flex-shrink: 0;
        }

        .nx-hero-icon {
            position: relative;
            width: var(--hero);
            height: var(--hero);
            border-radius: calc(var(--hero) * 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #FFD54F 0%, #FFB300 45%, #FF8F00 100%);
            box-shadow:
                0 20px 45px rgba(255,179,0,0.4),
                0 10px 22px rgba(255,179,0,0.28),
                inset 0 3px 0 rgba(255,255,255,0.55),
                inset 0 -5px 12px rgba(0,0,0,0.2);
            margin-bottom: clamp(6px, 1.2vmin, 14px);
            animation: nxHeroFloat 4s ease-in-out infinite;
        }
        @keyframes nxHeroFloat {
            0%,100% { transform: translateY(0) rotate(0); }
            50%     { transform: translateY(-6px) rotate(-2deg); }
        }

        .nx-hero-icon::before,
        .nx-hero-icon::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: calc(var(--hero) * 0.3);
            border: 2px solid rgba(255,179,0,0.6);
            pointer-events: none;
            animation: nxHeroRingOut 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }
        .nx-hero-icon::after { animation-delay: 1.5s; }
        @keyframes nxHeroRingOut {
            0%   { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        .nx-hero-icon i {
            font-size: calc(var(--hero) * 0.43);
            color: #0a0e17;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
            animation: nxHeroIconScale 3s ease-in-out infinite;
        }
        @keyframes nxHeroIconScale {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.08); }
        }

        .nx-pair-qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(10px, 1.8vmin, 16px);
            width: 100%;
            max-width: 700px;
            flex-shrink: 0;
        }

        .nx-qr-frame {
            position: relative;
            background: #fff;
            padding: clamp(14px, 2.2vmin, 24px);
            border-radius: 28px;
            box-shadow:
                0 30px 70px rgba(0,0,0,0.6),
                0 0 120px rgba(255,179,0,0.4),
                inset 0 0 0 1px rgba(255,179,0,0.2);
            animation: nxQrFloat 4s ease-in-out infinite;
        }
        @keyframes nxQrFloat {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-4px); }
        }
        .nx-qr-frame::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 30px;
            background: linear-gradient(135deg, #FFB300, #7C3AED, #06B6D4, #FFB300);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderFlow 6s linear infinite;
            filter: blur(0.5px);
        }
        @keyframes borderFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        #pair-qr-canvas img,
        #pair-qr-canvas canvas {
            display: block;
            width: var(--qr-p) !important;
            height: var(--qr-p) !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .nx-qr-corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid #FFB300;
            border-radius: 4px;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(255,179,0,0.8);
        }
        .nx-qr-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 14px 4px 4px 4px; }
        .nx-qr-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 4px 14px 4px 4px; }
        .nx-qr-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 4px 4px 4px 14px; }
        .nx-qr-br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 4px 4px 14px 4px; }

        .nx-or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            opacity: 0.75;
            margin: 6px 0;
        }
        .nx-or-divider span {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        }
        .nx-or-divider b {
            color: #FFD54F;
            font-size: 13px;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            white-space: nowrap;
        }

        /* ✅ الكود الدوّار 8 خانات */
        .pair-code-box {
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: clamp(16px, 2.2vmin, 24px) clamp(20px, 2.4vmin, 26px);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(255,179,0,0.10), rgba(124,58,237,0.05));
            border: 1.5px solid rgba(255,179,0,0.45);
            box-shadow:
                0 0 45px rgba(255,179,0,0.20),
                inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .pair-code-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFB300, #7C3AED, #06B6D4, #FFB300, transparent);
            background-size: 200% 100%;
            animation: nxShimmerLine 4s linear infinite;
        }
        @keyframes nxShimmerLine {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }

        .pair-code-text {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: clamp(36px, 6.5vmin, 58px);
            font-weight: 900;
            letter-spacing: clamp(8px, 1.4vmin, 16px);
            direction: ltr;
            color: #FFB300;
            text-shadow:
                0 0 30px rgba(255,179,0,0.75),
                0 0 60px rgba(255,179,0,0.45);
            padding-right: clamp(6px, 1.4vmin, 16px);
            line-height: 1;
            margin-bottom: 14px;
            transition: all 0.25s ease;
            min-height: 1em;
        }
        .pair-code-track {
            width: 100%;
            height: 9px;
            background: rgba(0,0,0,0.45);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,179,0,0.35);
            margin-bottom: 10px;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.5);
        }
        .pair-code-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #FFB300, #FFD54F, #7C3AED, #22D3EE, #FFD54F, #FFB300);
            background-size: 300% 100%;
            box-shadow: 0 0 16px rgba(255,179,0,0.75);
            border-radius: 6px;
            transition: width 0.2s linear;
            animation: pairBarFlow 4s linear infinite;
        }
        @keyframes pairBarFlow {
            0%   { background-position: 0% 0; }
            100% { background-position: -300% 0; }
        }
        .pair-code-hint {
            font-family: 'Cairo', sans-serif;
            font-size: clamp(11.5px, 1.7vmin, 14px);
            color: #c8d1e3;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }
        .pair-code-hint b {
            color: #FFD54F;
            font-family: 'Plus Jakarta Sans', monospace;
            font-weight: 900;
            font-size: 1.2em;
            text-shadow: 0 0 12px rgba(255,179,0,0.6);
            min-width: 28px;
            display: inline-block;
        }
        .pair-code-hint i {
            color: #FFB300;
            animation: nxSpin 2s linear infinite;
            font-size: 0.9em;
        }

        /* ===== شاشة العرض ===== */
        #display-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: calc(var(--pad) + var(--safe-top)) var(--pad) calc(var(--pad) + 70px + var(--safe-bottom));
            gap: var(--gap);
            position: relative;
            z-index: 2;
        }

        .info-wrap { text-align: center; }
        #subject-name {
            font-size: clamp(20px, 3.6vmin, 34px);
            font-weight: 900;
            background: linear-gradient(120deg, #fff 30%, #ffd76a 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        #session-title {
            color: #FFB300;
            font-size: clamp(14px, 2.2vmin, 20px);
            font-weight: 800;
            letter-spacing: 0.3px;
            padding: 6px 18px;
            display: inline-block;
            background: rgba(255,179,0,0.08);
            border: 1px solid rgba(255,179,0,0.25);
            border-radius: 12px;
        }

        .nx-qr-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        #qr-wrapper {
            background: #fff;
            padding: clamp(14px, 2.2vmin, 24px);
            border-radius: 28px;
            box-shadow:
                0 0 140px rgba(255,179,0,0.45),
                0 30px 80px rgba(0,0,0,0.65);
            position: relative;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
        }
        #qr-wrapper:hover {
            transform: scale(1.02);
            box-shadow:
                0 0 180px rgba(255,179,0,0.6),
                0 40px 100px rgba(0,0,0,0.75);
        }
        #qr-wrapper:active {
            transform: scale(0.98);
        }
        #qr-wrapper::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 30px;
            background: linear-gradient(135deg, #FFB300, #7C3AED, #06B6D4, #FFB300);
            background-size: 300% 300%;
            z-index: -1;
            animation: borderFlow 6s linear infinite;
        }

        .qr-hint {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,179,0,0.95), rgba(255,213,79,0.9));
            color: #0a0e17;
            font-family: 'Cairo', sans-serif;
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow:
                0 6px 20px rgba(255,179,0,0.5),
                0 0 0 2px rgba(10,14,23,0.4);
            z-index: 10;
            pointer-events: none;
            animation: qrHintBounce 2.5s ease-in-out infinite;
        }
        .qr-hint i { font-size: 10px; }
        @keyframes qrHintBounce {
            0%,100% { transform: translateX(-50%) translateY(0); }
            50%     { transform: translateX(-50%) translateY(-3px); }
        }

        #qr-canvas img, #qr-canvas canvas {
            display: block;
            width: var(--qr) !important;
            height: var(--qr) !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        #qr-wrapper.is-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 9990;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0d1220 0%, #05070f 100%);
            padding: 20px;
            border-radius: 0;
            cursor: zoom-out;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            box-shadow: none;
            animation: none;
            transform: none;
        }
        #qr-wrapper.is-fullscreen::before {
            inset: 0;
            border-radius: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,179,0,0.10), transparent 70%);
            z-index: 0;
        }
        #qr-wrapper.is-fullscreen #qr-canvas {
            position: relative;
            z-index: 2;
            background: #fff;
            padding: clamp(16px, 2.6vmin, 34px);
            border-radius: 28px;
            box-shadow:
                0 0 90px rgba(255,179,0,0.40),
                0 24px 70px rgba(0,0,0,0.8);
        }
        #qr-wrapper.is-fullscreen #qr-canvas img,
        #qr-wrapper.is-fullscreen #qr-canvas canvas {
            width: min(74vh, 74vw, 900px) !important;
            height: min(74vh, 74vw, 900px) !important;
        }

        #qr-wrapper.is-fullscreen .qr-hint {
            top: auto;
            bottom: 16px;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: #fff;
            box-shadow:
                0 6px 20px rgba(239,68,68,0.55),
                0 0 0 2px rgba(10,14,23,0.6);
            animation: none;
        }
        body.qr-fs #fs-btn { display: none !important; }

        body.qr-fs .qr-timer-block {
            position: fixed;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }
        body.qr-fs #qr-timer-track {
            width: 9px;
            height: min(58vh, 400px);
            border-radius: 99px;
            border: 1px solid rgba(239,68,68,0.35);
            background: rgba(239,68,68,0.08);
            box-shadow:
                0 0 22px rgba(239,68,68,0.35),
                inset 0 0 8px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        body.qr-fs #qr-timer-bar {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            width: 100% !important;
            height: calc(var(--pct, 100) * 1%);
            border-radius: 99px;
            background: linear-gradient(180deg,
                #FF6B6B 0%,
                #EF4444 35%,
                #DC2626 70%,
                #991B1B 100%);
            background-size: 100% 200%;
            box-shadow:
                0 0 16px rgba(239,68,68,0.9),
                0 0 34px rgba(239,68,68,0.5);
            animation: qrRedFlow 3s linear infinite;
            transition: height 0.2s linear;
        }
        @keyframes qrRedFlow {
            0%   { background-position: 0 0; }
            100% { background-position: 0 -200%; }
        }
        body.qr-fs #qr-seconds-label {
            flex-direction: column;
            gap: 2px;
            padding: 7px 5px;
            border-radius: 14px;
            background: linear-gradient(160deg,
                rgba(239,68,68,0.18),
                rgba(153,27,27,0.12));
            border: 1px solid rgba(239,68,68,0.5);
            box-shadow: 0 0 20px rgba(239,68,68,0.3);
            color: #FCA5A5;
            text-shadow: 0 0 10px rgba(239,68,68,0.7);
        }
        body.qr-fs #qr-seconds-label i {
            color: #F87171;
            font-size: 10px;
        }
        body.qr-fs #qr-seconds-label span:not(.qr-num) { display: none; }
        body.qr-fs #qr-seconds-label .qr-num {
            background: linear-gradient(180deg, #ffffff, #FCA5A5 40%, #EF4444 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 17px;
            filter: none;
        }

        .qr-timer-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(680px, 92vw, 62vh);
            margin-top: 4px;
        }
        #qr-timer-track {
            width: 100%;
            height: 10px;
            background:
                linear-gradient(90deg,
                    rgba(255,179,0,0.08),
                    rgba(124,58,237,0.08),
                    rgba(6,182,212,0.08));
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid rgba(255,179,0,0.35);
            box-shadow:
                0 0 26px rgba(255,179,0,0.3),
                0 0 40px rgba(124,58,237,0.15),
                inset 0 2px 3px rgba(0,0,0,0.5);
        }
        #qr-timer-bar {
            height: 100%;
            background: linear-gradient(90deg,
                #FFB300 0%,
                #FFD54F 20%,
                #A78BFA 45%,
                #22D3EE 65%,
                #FFD54F 85%,
                #FFB300 100%);
            background-size: 250% 100%;
            width: 100%;
            border-radius: 6px;
            box-shadow:
                0 0 18px rgba(255,179,0,0.7),
                0 0 30px rgba(124,58,237,0.4),
                0 0 40px rgba(6,182,212,0.3),
                inset 0 1px 2px rgba(255,255,255,0.5);
            transition: width 0.2s linear;
            animation: qrBarRoyalFlow 4s linear infinite;
        }
        @keyframes qrBarRoyalFlow {
            0%   { background-position: 0% 0; }
            100% { background-position: -250% 0; }
        }
        #qr-seconds-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: clamp(12px, 1.8vmin, 15px);
            font-weight: 900;
            letter-spacing: 0.5px;
            padding: 6px 16px;
            border-radius: 22px;
            background:
                linear-gradient(135deg,
                    rgba(255,179,0,0.15),
                    rgba(124,58,237,0.15),
                    rgba(6,182,212,0.15));
            border: 1.5px solid rgba(255,179,0,0.45);
            box-shadow:
                0 0 24px rgba(255,179,0,0.25),
                0 0 40px rgba(124,58,237,0.15),
                inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            color: #FFD54F;
            text-shadow: 0 0 12px rgba(255,179,0,0.6);
        }
        #qr-seconds-label i {
            font-size: 12px;
            color: #FFD54F;
            filter: drop-shadow(0 0 8px rgba(255,179,0,0.8));
            animation: qrSecPulse 1s ease-in-out infinite;
        }
        @keyframes qrSecPulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50%     { transform: scale(1.2); opacity: 0.6; }
        }
        #qr-seconds-label .qr-num {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: clamp(15px, 2.3vmin, 19px);
            font-weight: 900;
            background: linear-gradient(135deg, #FFD54F, #A78BFA, #22D3EE);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            min-width: 24px;
            text-align: center;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(255,213,79,0.5));
        }

        #code-section {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #code-label {
            color: #8b93a7;
            font-size: clamp(11px, 1.6vmin, 13px);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        #manual-code {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: var(--code);
            font-weight: 900;
            letter-spacing: clamp(6px, 1.6vmin, 20px);
            color: #FFB300;
            text-shadow: 0 0 44px rgba(255,179,0,0.7), 0 0 90px rgba(255,179,0,0.35);
            direction: ltr;
            padding-right: clamp(6px, 1.6vmin, 20px);
            line-height: 1;
            padding-top: 6px;
        }
        #timer-track {
            width: min(360px, 70vw);
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }
        #timer-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFB300, #FFD54F);
            width: 100%;
            transition: width 0.2s linear;
            box-shadow: 0 0 14px #FFB300;
            border-radius: 5px;
        }

        #status-badge {
            position: fixed;
            top: calc(12px + var(--safe-top));
            right: 12px;
            padding: 9px 16px;
            border-radius: 14px;
            font-size: clamp(11px, 1.6vmin, 13px);
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.4);
            color: #34d399;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #status-badge i { font-size: 8px; animation: blink 1.4s infinite; }
        #status-badge.closed {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.4);
            color: #f87171;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

        .bottom-actions {
            position: fixed;
            bottom: calc(12px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .disp-btn {
            padding: 10px 18px;
            border-radius: 14px;
            background: rgba(255,179,0,0.12);
            border: 1px solid rgba(255,179,0,0.45);
            color: #FFB300;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: clamp(11px, 1.6vmin, 14px);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all .25s ease;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        .disp-btn:hover {
            background: rgba(255,179,0,0.24);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(255,179,0,0.3);
        }
        .disp-btn.danger {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.45);
            color: #f87171;
        }
        .disp-btn.danger:hover {
            background: rgba(239,68,68,0.24);
            box-shadow: 0 10px 26px rgba(239,68,68,0.3);
        }

        @media (max-height: 640px) {
            .nx-hero-icon { display: none; }
            .nx-hero { margin-bottom: 6px; }
            .nx-logo-wrap { width: 56px; height: 56px; margin-bottom: 6px; }
            .nx-logo-core { width: 46px; height: 46px; font-size: 12px; }
            .nx-or-divider { display: none; }
            .bottom-actions { bottom: calc(8px + var(--safe-bottom)); gap: 8px; }
            .disp-btn { padding: 8px 12px; font-size: 11px; }
            .qr-timer-block { gap: 7px; }
        }

        @media (max-height: 500px) {
            .nx-logo-wrap { width: 44px; height: 44px; margin-bottom: 4px; }
            .nx-logo-core { width: 36px; height: 36px; font-size: 10px; letter-spacing: 1px; }
            .nx-hero { margin-bottom: 4px; }
            #pair-screen { justify-content: flex-start; }
            #display-screen { justify-content: flex-start; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #display-screen {
                flex-direction: row;
                justify-content: center;
                gap: clamp(12px, 2vw, 24px);
                padding: calc(var(--pad) + var(--safe-top)) var(--pad) calc(var(--pad) + 60px + var(--safe-bottom));
            }
            #display-screen .info-wrap { order: 1; max-width: 40%; }
            .nx-qr-block { order: 2; }
            #code-section { order: 3; max-width: 40%; }
            #manual-code { font-size: clamp(28px, 8vmin, 54px); }
            #timer-track { width: min(240px, 40vw); }
            .qr-timer-block { width: min(420px, 60vw); }

            #pair-screen { flex-direction: row; justify-content: center; gap: 20px; }
            #pair-screen .nx-logo-wrap,
            #pair-screen .nx-hero { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="nx-aurora" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>

    <div class="nx-particles" id="nx-particles" aria-hidden="true"></div>

    <button id="fs-btn" type="button" title="ملء الشاشة" aria-label="ملء الشاشة">
        <i class="fas fa-expand"></i>
    </button>

    <!-- ===== Pair Screen ===== -->
    <div id="pair-screen">
        <div class="nx-logo-wrap">
            <div class="nx-logo-ring"></div>
            <div class="nx-logo-core">BATU</div>
        </div>

        <div class="nx-hero">
            <div class="nx-hero-icon">
                <i class="fas fa-desktop"></i>
            </div>
        </div>

        <div class="nx-pair-qr-section">
            <div class="nx-qr-frame">
                <div id="pair-qr-canvas"></div>
                <div class="nx-qr-corner nx-qr-tl"></div>
                <div class="nx-qr-corner nx-qr-tr"></div>
                <div class="nx-qr-corner nx-qr-bl"></div>
                <div class="nx-qr-corner nx-qr-br"></div>
            </div>

            <div class="nx-or-divider">
                <span></span>
                <b>أو اكتب هذا الكود</b>
                <span></span>
            </div>

            <!-- ✅ الكود الدوّار 8 خانات -->
            <div class="pair-code-box">
                <div class="pair-code-text" id="pair-code-text">--------</div>
                <div class="pair-code-track">
                    <div class="pair-code-bar" id="pair-code-bar"></div>
                </div>
                <div class="pair-code-hint">
                    <i class="fas fa-sync-alt"></i>
                    <span>يتجدد بعد</span>
                    <b id="pair-code-seconds">20</b>
                    <span>ثانية</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Display Screen ===== -->
    <div id="display-screen">
        <div id="status-badge"><i class="fas fa-circle"></i> متصل بجلسة مباشرة</div>

        <div class="info-wrap">
            <div id="subject-name">...</div>
            <div id="session-title">...</div>
        </div>

        <div class="nx-qr-block">
            <div id="qr-wrapper" onclick="toggleQrFullscreen()" title="اضغط لتكبير الشاشة">
                <div class="qr-hint" id="qr-hint">
                    <i class="fas fa-expand"></i>
                    <span class="hint-text">اضغط للـ ملء الشاشة</span>
                </div>
                <div id="qr-canvas"></div>
            </div>

            <div class="qr-timer-block">
                <div id="qr-timer-track">
                    <div id="qr-timer-bar"></div>
                </div>
                <div id="qr-seconds-label">
                    <i class="fas fa-sync-alt"></i>
                    <span>يتجدد بعد</span>
                    <span id="qr-seconds" class="qr-num">3</span>
                    <span>ث</span>
                </div>
            </div>
        </div>

        <div id="code-section">
            <div id="code-label">أو اكتب الرمز يدوياً (6 خانات)</div>
            <div id="manual-code">------</div>
            <div id="timer-track"><div id="timer-bar"></div></div>
        </div>

        <div class="bottom-actions">
            <button class="disp-btn" id="toggle-code-btn">
                <i class="fas fa-keyboard"></i> <span>إظهار الكود</span>
            </button>
            <button class="disp-btn danger" onclick="unpairScreen()" id="unpair-btn">
                <i class="fas fa-exchange-alt"></i> <span>تغيير الجلسة</span>
            </button>
        </div>
    </div>

<script>
    /* ============================================================
       🖥️ Display Screen Logic — v13 (8-char pair code)
       ============================================================ */

    /* ---------- FULLSCREEN ---------- */
    (function () {
        const fsBtn = document.getElementById('fs-btn');
        const icon  = fsBtn.querySelector('i');

        function isFs() {
            return !!(document.fullscreenElement ||
                      document.webkitFullscreenElement ||
                      document.mozFullScreenElement ||
                      document.msFullscreenElement);
        }

        async function requestFs() {
            const el = document.documentElement;
            try {
                if (el.requestFullscreen)                 await el.requestFullscreen();
                else if (el.webkitRequestFullscreen)      el.webkitRequestFullscreen();
                else if (el.mozRequestFullScreen)         el.mozRequestFullScreen();
                else if (el.msRequestFullscreen)          el.msRequestFullscreen();
            } catch (e) {}
        }

        async function exitFs() {
            try {
                if (document.exitFullscreen)              await document.exitFullscreen();
                else if (document.webkitExitFullscreen)   document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen)    document.mozCancelFullScreen();
                else if (document.msExitFullscreen)       document.msExitFullscreen();
            } catch (e) {}
        }

        function updateFsBtn() {
            if (isFs()) {
                icon.className = 'fas fa-compress';
                fsBtn.title = 'إنهاء ملء الشاشة';
            } else {
                icon.className = 'fas fa-expand';
                fsBtn.title = 'ملء الشاشة';
            }
            const supported = !!(document.documentElement.requestFullscreen ||
                                 document.documentElement.webkitRequestFullscreen ||
                                 document.documentElement.mozRequestFullScreen ||
                                 document.documentElement.msRequestFullscreen);
            fsBtn.classList.toggle('show', supported);
        }

        fsBtn.addEventListener('click', () => {
            if (isFs()) exitFs(); else requestFs();
        });

        ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
            .forEach(ev => document.addEventListener(ev, updateFsBtn));

        updateFsBtn();

        let autoTried = false;
        const autoFs = () => {
            if (autoTried) return;
            autoTried = true;
            if (!isFs()) requestFs();
            document.removeEventListener('click', autoFs);
            document.removeEventListener('touchstart', autoFs);
            document.removeEventListener('keydown', autoFs);
        };
        document.addEventListener('click', autoFs, { passive: true });
        document.addEventListener('touchstart', autoFs, { passive: true });
        document.addEventListener('keydown', autoFs);
    })();

    /* ---------- PARTICLES ---------- */
    (function () {
        const container = document.getElementById('nx-particles');
        if (!container) return;
        const count = window.innerWidth < 768 ? 12 : 24;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'nx-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (10 + Math.random() * 14) + 's';
            p.style.animationDelay = (Math.random() * 14) + 's';
            const s = 1.5 + Math.random() * 2.5;
            p.style.width = s + 'px';
            p.style.height = s + 'px';
            if (Math.random() > 0.7) {
                p.style.background = '#7C3AED';
                p.style.boxShadow = '0 0 10px #7C3AED, 0 0 20px rgba(124,58,237,0.5)';
            } else if (Math.random() > 0.5) {
                p.style.background = '#06B6D4';
                p.style.boxShadow = '0 0 10px #06B6D4, 0 0 20px rgba(6,182,212,0.5)';
            }
            container.appendChild(p);
        }
    })();

    /* ---------- NUKE OLD STORAGE ---------- */
    (function nukeOldStorage() {
        try {
            localStorage.removeItem('nx_screen_secret');
            Object.keys(localStorage).forEach(k => {
                if (k && (k.includes('screen') || k.includes('nx_screen'))) {
                    localStorage.removeItem(k);
                }
            });
        } catch (e) {}
    })();

    /* ---------- NO-CACHE FETCH ---------- */
    const _origFetch = window.fetch;
    window.fetch = function(url, opts) {
        opts = opts || {};
        opts.cache = 'no-store';
        if ((!opts.method || opts.method === 'GET') && typeof url === 'string') {
            const sep = url.includes('?') ? '&' : '?';
            url = url + sep + '_t=' + Date.now();
        }
        return _origFetch(url, opts);
    };

    let currentSession = null;
    let currentSecret = null;
    let qrGenerator = null;
    let lastQrCode = null;
    let pollInterval = null;
    let codeVisible = false;
    let isPaired = false;

    let currentToken = null;
    let qrTokenGenerator = null;
    let tokenPollInterval = null;
    let qrWatchdogInterval = null;

    let qrIsFullscreen = false;
    let lastQrPct = 100;

    /* ---------- QR FULLSCREEN ---------- */
    function updateQrFullscreenUI() {
        const wrapper   = document.getElementById('qr-wrapper');
        const hintIcon  = document.querySelector('#qr-hint i');
        const hintText  = document.querySelector('#qr-hint .hint-text');
        if (!wrapper) return;

        if (qrIsFullscreen) {
            wrapper.classList.add('is-fullscreen');
            document.body.classList.add('qr-fs');
            document.body.style.overflow = 'hidden';
            if (hintIcon) hintIcon.className = 'fas fa-compress';
            if (hintText) hintText.textContent = 'اضغط في أي مكان للتصغير';
        } else {
            wrapper.classList.remove('is-fullscreen');
            document.body.classList.remove('qr-fs');
            document.body.style.overflow = '';
            if (hintIcon) hintIcon.className = 'fas fa-expand';
            if (hintText) hintText.textContent = 'اضغط للـ ملء الشاشة';
        }
    }

    async function toggleQrFullscreen() {
        const wrapper = document.getElementById('qr-wrapper');
        if (!wrapper) return;

        qrIsFullscreen = !qrIsFullscreen;
        updateQrFullscreenUI();

        if (qrIsFullscreen) {
            try {
                const el = document.documentElement;
                let p = null;
                if (el.requestFullscreen)            p = el.requestFullscreen();
                else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
                else if (el.mozRequestFullScreen)    p = el.mozRequestFullScreen();
                else if (el.msRequestFullscreen)     p = el.msRequestFullscreen();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        } else {
            try {
                if (document.fullscreenElement ||
                    document.webkitFullscreenElement ||
                    document.mozFullScreenElement ||
                    document.msFullscreenElement) {
                    let p = null;
                    if (document.exitFullscreen)            p = document.exitFullscreen();
                    else if (document.webkitExitFullscreen) p = document.webkitExitFullscreen();
                    else if (document.mozCancelFullScreen)  p = document.mozCancelFullScreen();
                    else if (document.msExitFullscreen)     p = document.msExitFullscreen();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                }
            } catch (e) {}
        }
    }

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
        .forEach(ev => document.addEventListener(ev, () => {
            const nativeFs = !!(document.fullscreenElement ||
                                document.webkitFullscreenElement ||
                                document.mozFullScreenElement ||
                                document.msFullscreenElement);
            if (qrIsFullscreen && !nativeFs) {
                qrIsFullscreen = false;
                updateQrFullscreenUI();
            }
        }));

    /* ---------- POLLING ---------- */
    function stopPolling() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    }

    function startPolling() {
        stopPolling();
        if (!isPaired || !currentSecret) return;
        fetchScreenCode();
        pollInterval = setInterval(fetchScreenCode, 1000);
    }

    /* ---------- PAIRING TOKEN ---------- */
    async function requestNewToken() {
        try {
            const res = await fetch('/api/screen-new-token', { method: 'POST', cache: 'no-store' });
            const data = await res.json();
            if (data.status !== 'success' || !data.token) return;
            currentToken = data.token;
            drawPairQR(currentToken);
        } catch (e) {}
    }

    function drawPairQR(token) {
        const container = document.getElementById('pair-qr-canvas');
        if (!container) return;
        container.innerHTML = '';
        qrTokenGenerator = null;
        try {
            qrTokenGenerator = new QRCode(container, {
                width: 1000,
                height: 1000,
                correctLevel: QRCode.CorrectLevel.H
            });
            qrTokenGenerator.makeCode(token);
        } catch (e) {}
    }

    /* ---------- ✅ NEW: PAIR CODE UPDATE ---------- */
    function updatePairCode(data) {
        const codeEl = document.getElementById('pair-code-text');
        if (codeEl && data.pair_code && codeEl.textContent !== data.pair_code) {
            codeEl.textContent = data.pair_code;
            codeEl.style.transform = 'scale(1.06)';
            setTimeout(() => { codeEl.style.transform = 'scale(1)'; }, 180);
        }

        const barEl = document.getElementById('pair-code-bar');
        if (barEl && data.pair_interval) {
            const pct = Math.max(0, Math.min(100, (data.pair_remaining / data.pair_interval) * 100));
            barEl.style.width = pct + '%';
        }

        const secEl = document.getElementById('pair-code-seconds');
        if (secEl && data.pair_remaining !== undefined) {
            secEl.textContent = Math.max(0, Math.ceil(data.pair_remaining));
        }
    }

    async function checkPairing() {
        if (!currentToken) return;
        try {
            const res = await fetch('/api/screen-check-pair?token=' + encodeURIComponent(currentToken), { cache: 'no-store' });
            const data = await res.json();

            if (data.status === 'paired') {
                stopTokenPolling();
                stopQrWatchdog();
                currentSecret = data.screen_secret;
                currentSession = data.session_info || {};
                isPaired = true;
                startDisplay();
            } else if (data.status === 'expired') {
                await requestNewToken();
            } else if (data.status === 'waiting' && data.pair_code) {
                updatePairCode(data);
            }
        } catch (e) {}
    }

    function startTokenPolling() {
        stopTokenPolling();
        checkPairing();
        tokenPollInterval = setInterval(checkPairing, 1200);
    }

    function stopTokenPolling() {
        if (tokenPollInterval) { clearInterval(tokenPollInterval); tokenPollInterval = null; }
    }

    function startQrWatchdog() {
        stopQrWatchdog();
        qrWatchdogInterval = setInterval(() => {
            if (isPaired || !currentToken) return;
            const container = document.getElementById('pair-qr-canvas');
            if (!container) return;
            if (container.children.length === 0) { drawPairQR(currentToken); return; }
            const canvas = container.querySelector('canvas');
            const img = container.querySelector('img');
            if (!canvas && !img) drawPairQR(currentToken);
        }, 2500);
    }

    function stopQrWatchdog() {
        if (qrWatchdogInterval) { clearInterval(qrWatchdogInterval); qrWatchdogInterval = null; }
    }

    function showPairScreen(message) {
        stopPolling();
        stopTokenPolling();
        stopQrWatchdog();

        if (qrIsFullscreen) {
            qrIsFullscreen = false;
            updateQrFullscreenUI();
        }

        isPaired = false;
        currentSecret = null;
        currentSession = null;
        currentToken = null;
        lastQrCode = null;
        codeVisible = false;

        document.getElementById('display-screen').style.display = 'none';
        document.getElementById('pair-screen').style.display = 'flex';

        // reset pair code display
        const codeEl = document.getElementById('pair-code-text');
        if (codeEl) codeEl.textContent = '--------';
        const barEl = document.getElementById('pair-code-bar');
        if (barEl) barEl.style.width = '100%';
        const secEl = document.getElementById('pair-code-seconds');
        if (secEl) secEl.textContent = '20';

        qrTokenGenerator = null;
        requestNewToken();
        startTokenPolling();
        startQrWatchdog();

        if (message) {
            Swal.fire({
                background: '#1a1f2c', color: '#fff',
                icon: 'info',
                title: 'الشاشة',
                text: message,
                confirmButtonText: 'حسناً',
                confirmButtonColor: '#FFB300'
            });
        }
    }

    /* ---------- DISPLAY START ---------- */
    function startDisplay() {
        stopTokenPolling();
        stopPolling();
        stopQrWatchdog();

        document.getElementById('pair-screen').style.display = 'none';
        document.getElementById('display-screen').style.display = 'flex';

        if (currentSession) {
            document.getElementById('subject-name').textContent = currentSession.subject_name || '';
            document.getElementById('session-title').textContent = currentSession.title || '';
        }

        const unpairBtn = document.getElementById('unpair-btn');
        if (unpairBtn) {
            const span = unpairBtn.querySelector('span');
            if (span) {
                const isQuiz = currentSession && currentSession.is_quiz === true;
                span.textContent = isQuiz ? 'إعادة تحميل' : 'تغيير الجلسة';
            }
        }

        const canvas = document.getElementById('qr-canvas');
        canvas.innerHTML = '';
        qrGenerator = new QRCode(canvas, {
            width: 1200,
            height: 1200,
            correctLevel: QRCode.CorrectLevel.H
        });
        lastQrCode = null;

        setStatus(true);
        startPolling();
    }

    /* ---------- LIVE CODE FETCH (Attendance + Quiz) ---------- */
    async function fetchScreenCode() {
        if (!currentSecret) return;

        const isQuiz = currentSession && currentSession.is_quiz === true;

        try {
            let url = '/api/screen-live-code?secret=' + encodeURIComponent(currentSecret);
            if (isQuiz) url += '&is_quiz=1';

            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'closed') {
                setStatus(false);

                if (isQuiz) {
                    if (data.session_info) {
                        const subEl = document.getElementById('subject-name');
                        const titleEl = document.getElementById('session-title');
                        if (subEl) subEl.textContent = data.session_info.subject_name || '';
                        if (titleEl) titleEl.textContent = data.session_info.title || '';
                    }
                    return;
                }

                showPairScreen('انتهت الجلسة — اطلب كود جديد من الأدمن');
                return;
            }

            if (data.status !== 'success') { setStatus(false); return; }
            setStatus(true);

            if (data.session_info) {
                const subEl = document.getElementById('subject-name');
                const titleEl = document.getElementById('session-title');
                const newSub = data.session_info.subject_name || '';
                const newTitle = data.session_info.title || '';
                if (subEl.textContent !== newSub) subEl.textContent = newSub;
                if (titleEl.textContent !== newTitle) titleEl.textContent = newTitle;
            }

            applyLiveCodes(data);
        } catch (e) { setStatus(false); }
    }

    /* ---------- APPLY CODES ---------- */
    function applyLiveCodes(data) {
        /* Manual code */
        const manualCode = data.manual_code || '------';
        const manualEl = document.getElementById('manual-code');
        if (manualEl.textContent !== manualCode) manualEl.textContent = manualCode;

        /* Manual timer bar */
        const interval = data.manual_interval || 10;
        const remaining = data.manual_remaining || 0;
        const barEl = document.getElementById('timer-bar');
        if (barEl) barEl.style.width = ((remaining / interval) * 100) + '%';

        /* QR timer bar */
        const qrInterval = data.qr_interval || 3;
        const qrRemaining = (data.qr_remaining !== undefined) ? data.qr_remaining : 0;

        const qrBarEl = document.getElementById('qr-timer-bar');
        if (qrBarEl) {
            const pct = Math.max(0, Math.min(100, (qrRemaining / qrInterval) * 100));
            lastQrPct = pct;
            qrBarEl.style.width = pct + '%';
            qrBarEl.style.setProperty('--pct', pct);
        }

        /* QR seconds */
        const qrSecEl = document.getElementById('qr-seconds');
        if (qrSecEl) {
            const secs = Math.max(0, Math.ceil(qrRemaining));
            if (qrSecEl.textContent !== String(secs)) {
                qrSecEl.textContent = secs;
            }
        }

        /* QR code */
        const qrCode = data.qr_code;
        if (qrCode && qrCode !== lastQrCode && qrGenerator) {
            lastQrCode = qrCode;
            try { qrGenerator.clear(); qrGenerator.makeCode(qrCode); } catch (e) {}
        }
    }

    /* ---------- STATUS ---------- */
    function setStatus(isOpen) {
        const badge = document.getElementById('status-badge');
        if (!badge) return;
        if (isOpen) {
            badge.classList.remove('closed');
            badge.innerHTML = '<i class="fas fa-circle"></i> متصل بجلسة مباشرة';
        } else {
            badge.classList.add('closed');
            badge.innerHTML = '<i class="fas fa-circle"></i> الجلسة مغلقة';
        }
    }

    function toggleCodeSection() {
        codeVisible = !codeVisible;
        const sec = document.getElementById('code-section');
        const btn = document.getElementById('toggle-code-btn');
        sec.style.display = codeVisible ? 'flex' : 'none';
        if (btn) {
            const span = btn.querySelector('span');
            if (span) span.textContent = codeVisible ? 'إخفاء الكود' : 'إظهار الكود';
            const icon = btn.querySelector('i');
            if (icon) icon.className = codeVisible ? 'fas fa-eye-slash' : 'fas fa-keyboard';
        }
    }

    function unpairScreen() {
        const isQuiz = currentSession && currentSession.is_quiz === true;

        if (isQuiz) {
            Swal.fire({
                background: '#1a1f2c', color: '#fff',
                icon: 'info',
                title: 'وضع الامتحان',
                html: '<p style="color:#8b93a7; font-size:13px;">الشاشة مرتبطة بالامتحان. لإيقاف العرض أوقف البث من لوحة الأدمن.</p>',
                showCancelButton: true,
                confirmButtonText: 'إعادة تحميل',
                cancelButtonText: 'إغلاق',
                confirmButtonColor: '#FFB300',
                cancelButtonColor: '#374151'
            }).then(r => {
                if (r.isConfirmed) location.reload();
            });
            return;
        }

        Swal.fire({
            background: '#1a1f2c', color: '#fff',
            icon: 'warning',
            title: 'إلغاء ربط الشاشة؟',
            html: '<p style="color:#8b93a7; font-size:13px;">سيتوقف عرض الكود حتى تدخل كود جديد</p>',
            showCancelButton: true,
            confirmButtonText: 'إلغاء الربط',
            cancelButtonText: 'تراجع',
            confirmButtonColor: '#EF4444',
            cancelButtonColor: '#374151',
            reverseButtons: true
        }).then(r => {
            if (!r.isConfirmed) return;
            showPairScreen('');
        });
    }

    /* ============================================================
       🚀 INIT
       ============================================================ */
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('toggle-code-btn');
        if (toggleBtn) toggleBtn.addEventListener('click', toggleCodeSection);

        // Always start with pair screen
        showPairScreen('');
    });

    /* ============================================================
       VISIBILITY
       ============================================================ */
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopPolling();
            stopTokenPolling();
            stopQrWatchdog();
        } else {
            if (isPaired) {
                startPolling();
            } else if (currentToken) {
                startTokenPolling();
                startQrWatchdog();
                const container = document.getElementById('pair-qr-canvas');
                if (container && container.children.length === 0) drawPairQR(currentToken);
            }
        }
    });

    ['pagehide','beforeunload','unload'].forEach(ev => {
        window.addEventListener(ev, () => {
            stopPolling();
            stopTokenPolling();
            stopQrWatchdog();
        });
    });
</script>
</body>
</html>
